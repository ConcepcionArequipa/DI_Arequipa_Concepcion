<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<body class="font-['Open_Sans',sans-serif] m-0 text-[var(--dark)] leading-[1.5] bg-[#f4f6f7] pt-[80px]">

    </header>

    <section class="py-[56px] px-[18px]" id="projects">

        <div class="m-[0_auto] max-w-[1100px]">

            <div class="p-[28px] bg-[#e6eaeb]"> <!-- projects-->

                <!-- projects- grid -->
                <div class="grid grid-cols-[repeat(auto-fit,minmax(220px,1fr))] gap-[18px]">
                    <div class="grid grid-cols-[repeat(auto-fit,minmax(220px,1fr))] gap-[18px]" id="projectsGrid">
                        <!-- Proyectos cargados desde el admin -->
                    </div>
                </div>

    <div id="footer"></div>
    <script src="assets/js/footer.js"></script>

<script src="assets/js/menu.js"></script>

</html>
