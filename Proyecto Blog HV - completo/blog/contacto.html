<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
    class="font-['Open_Sans',sans-serif] m-0 text-[var(--dark)] leading-[1.5] bg-[#f4f6f7] pt-[80px] flex flex-col min-h-screen">
    <main class="flex-grow">
        <header>
            <div id="menu"></div>
        </header>
        <section class="text-[#171717] p-[20px]">
            <div class="flex items-center justify-between gap-[18px] text-center max-w-[1100px] mx-auto">
                <div>
                    <h3 class="text-[20px] font-bold mb-[8px]">Contáctame</h3>
                    <p class="max-w-[420px] text-[16px] leading-relaxed">¿Tienes un proyecto o quieres colaborar?
                        Escríbeme
                        y conversemos sobre ideas
                        y soluciones.</p>
                </div>
                <div class="flex gap-[12px]">
                    <a href="#"
                        class="inline-flex items-center justify-center bg-[rgba(255,255,255,0.12)] text-[#fff] no-underline">
                        <img src="assets/images/twitter.jpg" alt="twitter"
                            class="w-[50px] h-[50px] rounded-full items-center justify-center inline-flex"></a>
                    <a href="https://www.facebook.com/reel/1185148380386300"
                        class="inline-flex items-center justify-center bg-[rgba(255,255,255,0.12)] text-[#fff] no-underline">
                        <img src="assets/images/face.png" alt="facebook"
                            class="w-[50px] h-[50px] rounded-full items-center justify-center inline-flex"></a>
                    <a href="#"
                        class="inline-flex items-center justify-center bg-[rgba(255,255,255,0.12)] text-[#fff] no-underline">
                        <img src="assets/images/instagram.png" alt="instagram"
                            class="w-[50px] h-[50px] rounded-full items-center justify-center inline-flex"></a>
                </div>
            </div>
        </section>
    </main>


    <script src="assets/js/footer.js"></script>
    <div id="footer"></div>
    <script src="assets/js/footer.js"></script>
</body>

<script src="assets/js/menu.js"></script>

</html>
